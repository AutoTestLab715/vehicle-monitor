name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MySQL and MQTT
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            docker exec vehicle-mysql mysqladmin ping -h localhost -uroot -proot123 --silent && break
            sleep 2
          done
          docker exec vehicle-mysql mysqladmin ping -h localhost -uroot -proot123 --silent
          for i in $(seq 1 30); do
            docker exec vehicle-mysql mysql -uroot -proot123 -e "SELECT 1" vehicle_monitor && break
            sleep 2
          done
          for i in $(seq 1 15); do
            nc -z 127.0.0.1 1883 && break
            sleep 1
          done
          nc -z 127.0.0.1 1883

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Write CI environment
        run: |
          printf '%s\n' \
            'PORT=3000' \
            'DATABASE_URL=mysql+pymysql://root:root123@127.0.0.1:3306/vehicle_monitor?charset=utf8mb4' \
            'MQTT_BROKER=127.0.0.1' \
            'MQTT_PORT=1883' \
            'MQTT_TELEMETRY_TOPIC=vehicle/+/telemetry' \
            'MQTT_COMMAND_PREFIX=vehicle' \
            > server/local.env
          cat server/local.env

      - name: Start Flask server
        run: |
          cd server
          nohup python run.py > ../flask.log 2>&1 &
          echo $! > ../flask.pid
          cd ..
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              echo "Flask is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Flask failed to start. Log:"
          cat flask.log || true
          exit 1

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest
        working-directory: tests
        env:
          API_BASE_URL: http://127.0.0.1:3000/api
          DATABASE_URL: mysql+pymysql://root:root123@127.0.0.1:3306/vehicle_monitor?charset=utf8mb4
          MQTT_BROKER: 127.0.0.1
          MQTT_PORT: 1883
        run: pytest -m "not fault" --tb=short

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: tests/allure-results
          retention-days: 14

      - name: Stop Flask server
        if: always()
        run: |
          if [ -f flask.pid ]; then
            kill "$(cat flask.pid)" || true
          fi
