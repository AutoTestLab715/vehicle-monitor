name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DATABASE_URL: mysql+pymysql://vehicle:vehicle123@127.0.0.1:3306/vehicle_monitor?charset=utf8mb4
  API_BASE_URL: http://127.0.0.1:3000/api
  MQTT_BROKER: 127.0.0.1
  MQTT_PORT: 1883

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MySQL and MQTT
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            docker exec vehicle-mysql mysqladmin ping -h localhost -uroot -proot123 --silent && break
            sleep 2
          done
          docker exec vehicle-mysql mysqladmin ping -h localhost -uroot -proot123 --silent
          for i in $(seq 1 30); do
            docker exec vehicle-mysql mysql -uvehicle -pvehicle123 -e "SELECT 1" vehicle_monitor && break
            sleep 2
          done
          for i in $(seq 1 15); do
            nc -z 127.0.0.1 1883 && break
            sleep 1
          done
          nc -z 127.0.0.1 1883

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Verify host can reach MySQL
        run: |
          python - <<'PY'
          import os
          import pymysql
          from urllib.parse import urlparse, unquote
          url = urlparse(os.environ['DATABASE_URL'].replace('mysql+pymysql://', 'mysql://'))
          conn = pymysql.connect(
              host=url.hostname,
              port=url.port or 3306,
              user=unquote(url.username or ''),
              password=unquote(url.password or ''),
              database=url.path.lstrip('/').split('?')[0],
          )
          conn.close()
          print('MySQL host connection OK')
          PY

      - name: Start Flask server
        run: |
          cd server
          nohup env PORT=3000 DATABASE_URL="$DATABASE_URL" MQTT_BROKER="$MQTT_BROKER" MQTT_PORT="$MQTT_PORT" \
            python -u run.py > ../flask.log 2>&1 &
          echo $! > ../flask.pid
          cd ..
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              echo "Flask is ready"
              exit 0
            fi
            if ! kill -0 "$(cat flask.pid)" 2>/dev/null; then
              echo "Flask process exited early"
              cat flask.log || true
              exit 1
            fi
            sleep 2
          done
          echo "Flask health check timed out. Log:"
          cat flask.log || true
          exit 1

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest
        working-directory: tests
        run: pytest -m "not fault" --tb=short

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: tests/allure-results
          retention-days: 14

      - name: Upload Flask log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flask-log
          path: flask.log
          retention-days: 7

      - name: Stop Flask server
        if: always()
        run: |
          if [ -f flask.pid ]; then
            kill "$(cat flask.pid)" || true
          fi
