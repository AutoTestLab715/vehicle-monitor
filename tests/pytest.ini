[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: 冒烟测试，验证服务基础可用性
    telemetry: 设备遥测上报与数据库一致性
    control: 远程控制与指令队列
    alarm: 报警联动与 alarm_records 校验
    history: 历史数据与统计接口
    mqtt: MQTT 遥测上报与指令下发
    websocket: WebSocket 实时推送
    exception: 异常与边界场景
    fault: 破坏性故障测试，需 --run-fault-tests
addopts = -v --tb=short --alluredir=allure-results --clean-alluredir
